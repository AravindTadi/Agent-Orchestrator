<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - AgentHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .chat-layout {
            display: flex;
            height: 100%;
            flex-direction: column;
            background: white;
        }

        .chat-selection-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #f4f4f4;
        }

        .agent-select {
            padding: 0.8rem;
            font-size: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            min-width: 250px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Global Sidebar -->
        <nav class="main-nav" id="main-nav">
            <div class="nav-header">
                AgentHub
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    Agents
                </a>
                <a href="chat.html" class="nav-item active">
                    Chat
                </a>
                <a href="connections.html" class="nav-item">
                    Connections
                </a>
                <a href="tools.html" class="nav-item">
                    Tools
                </a>
                <a href="analytics.html" class="nav-item">
                    Analytics
                </a>
                <a href="integrations.html" class="nav-item">
                    Integrations
                </a>
            </div>
        </nav>

        <!-- Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Top Navbar -->
        <div class="top-navbar">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
                </svg>
            </button>
            <div class="navbar-title">Chat</div>
            <div class="navbar-right">
                <!-- Profile Dropdown -->
                <div class="profile-dropdown" id="profile-dropdown">
                    <button class="profile-btn" onclick="toggleProfileMenu()" title="Profile" type="button">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                            </path>
                        </svg>
                    </button>
                    <div class="profile-menu" id="profile-menu">
                        <div class="profile-menu-header">
                            <div class="profile-avatar">
                                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                                    <path
                                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                                    </path>
                                </svg>
                            </div>
                            <div class="profile-info">
                                <span class="profile-name" id="profile-name">Guest User</span>
                                <span class="profile-email" id="profile-email">Not logged in</span>
                            </div>
                        </div>
                        <div class="profile-menu-divider"></div>
                        <a href="#" class="profile-menu-item" onclick="openSettingsPage()">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path
                                    d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                            </svg>
                            Settings
                        </a>
                        <a href="#" class="profile-menu-item" onclick="openRegionSelector()">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path
                                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5-2.5 2.5z" />
                            </svg>
                            Region
                            <span class="menu-badge" id="current-region">US-East</span>
                        </a>
                        <a href="#" class="profile-menu-item" onclick="openApiKeys()">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path
                                    d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" />
                            </svg>
                            API Keys
                        </a>

                        <div class="profile-menu-divider"></div>
                        <a href="#" class="profile-menu-item logout" onclick="handleLogout()">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path
                                    d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
                            </svg>
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="chat-page-layout">
                <!-- Chat History Sidebar -->
                <aside class="chat-history-sidebar">
                    <div class="chat-history-header">
                        <h3>History</h3>
                        <button class="new-chat-icon-btn" onclick="startNewChat()" title="New Chat">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                            </svg>
                        </button>
                    </div>
                    <div class="chat-session-list" id="session-list">
                        <!-- Sessions will be injected here -->
                    </div>
                </aside>

                <!-- Center: Chat Interface -->
                <section class="chat-interface">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <div class="status-dot"></div>
                            <h3 id="current-agent-name">Select an Agent</h3>
                        </div>
                        <div class="chat-header-right">
                            <select id="model-select" class="model-select">
                                <option value="llama-3.3-70b-versatile">Llama 3.3 (70B)</option>
                                <option value="llama-3.1-8b-instant">Llama 3.1 (8B Instant)</option>
                            </select>
                            <button class="refresh-btn" onclick="resetChat()" title="Reset Chat">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="chat-history" id="chat-history">
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" style="opacity:0.2">
                                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
                                </svg>
                            </div>
                            <h3>Welcome to AgentHub Chat</h3>
                            <p>Select an agent from the right sidebar to start a conversation.</p>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="user-input" placeholder="Type a message..."
                            onkeypress="handleKeyPress(event)" disabled>
                        <button id="send-btn" onclick="sendMessage()" disabled>
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </button>
                    </div>
                </section>

                <!-- Right: Agent Sidebar -->
                <aside class="agent-sidebar-right">
                    <div class="sidebar-header">
                        <h3>Available Agents</h3>
                    </div>
                    <div class="agent-list-right" id="chat-agent-list">
                        <!-- Agents will be injected here -->
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script src="js/modals.js"></script>
    <script src="js/script.js?v=17"></script>
    <script>
        // Override initialization for Chat Page
        document.addEventListener('DOMContentLoaded', async () => {
            // Load agents from API or LocalStorage
            await loadAgentsFromAPI(); // This populates the global 'agents' object
            renderChatAgentList();

            // Restore previously selected agent
            const savedAgentId = localStorage.getItem('chat_selected_agent');
            if (savedAgentId && agents[savedAgentId]) {
                switchChatAgent(savedAgentId);
            }
        });

        function renderChatAgentList() {
            const list = document.getElementById('chat-agent-list');
            list.innerHTML = '';

            const agentArray = Object.values(agents);

            if (agentArray.length === 0) {
                list.innerHTML = '<p class="no-agents">No agents found.</p>';
                return;
            }

            agentArray.forEach(agent => {
                const item = document.createElement('div');
                item.className = `agent-card-item ${currentAgentId === agent.id ? 'active' : ''}`;
                item.onclick = () => switchChatAgent(agent.id);

                // Get first letter for avatar
                const initial = agent.name.charAt(0).toUpperCase();

                item.innerHTML = `
                    <div class="agent-avatar-small">${initial}</div>
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-desc">${agent.description || 'No description'}</div>
                    </div>
                    <div class="agent-status"></div>
                `;
                list.appendChild(item);
            });
        }

        function switchChatAgent(agentId) {
            if (!agentId) return;

            currentAgentId = agentId;
            const agent = agents[agentId];

            // Update UI
            document.getElementById('current-agent-name').textContent = agent.name;

            // Update Active State in List
            renderChatAgentList();

            // Reset Chat UI
            chatHistory = [];
            document.getElementById('chat-history').innerHTML = `
                <div class="empty-state">
                    <div class="agent-avatar-large">${agent.name.charAt(0).toUpperCase()}</div>
                    <h3>Chat with ${agent.name}</h3>
                    <p>${agent.description || 'Ready to help you.'}</p>
                </div>
            `;

            // Enable Input
            document.getElementById('user-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('user-input').focus();

            // Save selected agent to localStorage for persistence
            localStorage.setItem('chat_selected_agent', agentId);

            // Load history
            loadChatSessions();
        }
    </script>
</body>

</html>
