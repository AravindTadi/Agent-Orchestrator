<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Orchestrator</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Global Sidebar -->
        <nav class="main-nav" id="main-nav">
            <div class="nav-header">
                AgentHub
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-item active">
                    Agents
                </a>
                <a href="chat.html" class="nav-item">
                    Chat
                </a>
            </div>
        </nav>

        <!-- Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Top Navbar -->
        <div class="top-navbar">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
                </svg>
            </button>
            <div class="navbar-title">Orchestrate</div>
            <div class="navbar-right">
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark Mode">
                    <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z">
                        </path>
                    </svg>
                </button>
                <button class="profile-btn" onclick="openProfile()" title="Profile">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Orchestrator Content (Nested Grid) -->
        <div class="main-content">
            <div class="orchestrator-layout">
                <!-- Left Sidebar: Agent List -->
                <aside class="sidebar">
                    <div class="agent-list" id="agent-list">
                        <!-- Agents will be injected here -->
                    </div>
                    <button class="create-agent-btn" onclick="createNewAgent()">
                        <span>+</span> New Agent
                    </button>
                </aside>

                <!-- Center Panel: Agent Configuration -->
                <main class="config-panel">
                    <div class="config-header">
                        <div class="editable-name-container">
                            <input type="text" id="agent-name-header" class="agent-name-input" placeholder="Agent Name"
                                onblur="saveNameFromHeader()" onkeypress="handleNameKeyPress(event)" maxlength="15"
                                oninput="checkNameLimit(this)">
                            <button class="edit-icon-btn" onclick="focusNameInput()">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                    <path
                                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z">
                                    </path>
                                </svg>
                            </button>
                            <span id="name-limit-msg" class="limit-msg">Max 15 chars</span>
                        </div>
                        <button class="delete-agent-btn" id="delete-agent-btn" onclick="deleteCurrentAgent()"
                            title="Delete Agent">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z">
                                </path>
                            </svg>
                            Delete Agent
                        </button>
                    </div>

                    <div class="config-form">
                        <!-- Name Input Removed -->

                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="agent-desc" rows="2" placeholder="What does this agent do?"
                                oninput="autoSaveAgentConfig()"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="agent-prompt">Behavior / System Prompt</label>
                            <textarea id="agent-prompt" placeholder="You are a helpful assistant who..."
                                oninput="autoSaveAgentConfig()"></textarea>
                            <p class="hint">Define the personality and rules for this agent.</p>
                        </div>

                        <div class="form-group">
                            <label>Capabilities</label>
                            <div class="capabilities-list">
                                <label class="checkbox-container">
                                    <input type="checkbox" checked disabled>
                                    <span class="checkmark"></span>
                                    AWS Tools (S3 Management)
                                </label>
                            </div>
                        </div>

                        <!-- Save Button (visible when creating new agent) -->
                        <div class="form-actions" id="form-actions">
                            <button class="save-agent-btn" id="save-agent-btn" onclick="saveAgentConfig(false)">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                    <path
                                        d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z">
                                    </path>
                                </svg>
                                Save Agent
                            </button>
                        </div>
                        <!-- Knowledge Base Section -->
                        <div class="form-group knowledge-base-section">
                            <label>
                                📚 Knowledge Base (RAG)
                                <span class="doc-count" id="doc-count">0 documents</span>
                            </label>

                            <!-- Upload Area -->
                            <div class="upload-area" id="upload-area"
                                onclick="document.getElementById('file-input').click()"
                                ondragover="handleDragOver(event)" ondrop="handleDrop(event)"
                                ondragleave="handleDragLeave(event)">
                                <input type="file" id="file-input" accept=".txt,.pdf,.docx,.doc,.csv" multiple hidden
                                    onchange="handleFileSelect(event)">
                                <div class="upload-icon">📄</div>
                                <p>Drag & drop files here or <span class="upload-link">browse</span></p>
                                <p class="hint">Supports: TXT, PDF, DOCX, CSV</p>
                            </div>

                            <!-- URL Input -->
                            <div class="url-input-group">
                                <input type="url" id="url-input" placeholder="https://example.com/page-to-learn-from"
                                    onkeypress="if(event.key==='Enter') addUrl()">
                                <button class="add-url-btn" onclick="addUrl()">+ Add URL</button>
                            </div>

                            <!-- Document List -->
                            <div class="document-list" id="document-list">
                                <!-- Documents will be rendered here -->
                            </div>
                        </div>
                </main>

                <!-- Right Sidebar: Chat -->
                <aside class="chat-panel">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <div class="status-dot"></div>
                            <h3>Choose Model</h3>
                        </div>
                        <div class="chat-header-right">
                            <select id="model-select" class="model-select">
                                <option value="llama-3.3-70b-versatile">Llama 3.3 (70B)</option>
                                <option value="llama-3.1-8b-instant">Llama 3.1 (8B Instant)</option>
                            </select>
                            <button class="refresh-btn" onclick="resetChat()" title="Reset Chat">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="chat-history" id="chat-history">
                        <div class="empty-state">
                            Select or create an agent to start chatting.
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="user-input" placeholder="Type a message..."
                            onkeypress="handleKeyPress(event)" disabled>
                        <button id="send-btn" onclick="sendMessage()" disabled>
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </button>
                    </div>
                </aside>
            </div> <!-- End orchestrator-layout -->

            <div id="toast" class="toast">Agent configuration saved!</div>
            <script src="js/script.js"></script>
        </div> <!-- End main-content -->
    </div> <!-- End app-container -->
</body>

</html>
