<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - AgentHub</title>
    <link rel="stylesheet" href="css/style.css?v=watsonx">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Global Sidebar -->
        <nav class="main-nav" id="main-nav">
            <div class="nav-header">
                AgentHub
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    Agents
                </a>
                <a href="chat.html" class="nav-item">
                    Chat
                </a>
                <a href="connections.html" class="nav-item">
                    Connections
                </a>
                <a href="tools.html" class="nav-item active">
                    Tools
                </a>
                <a href="analytics.html" class="nav-item">
                    Analytics
                </a>
                <a href="integrations.html" class="nav-item">
                    Integrations
                </a>
            </div>
        </nav>

        <!-- Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Top Navbar -->
        <div class="top-navbar">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
                </svg>
            </button>
            <div class="navbar-title">Tools</div>
            <div class="navbar-right">
                <div class="profile-dropdown" id="profile-dropdown">
                    <button class="profile-btn" onclick="toggleProfileMenu()" title="Profile" type="button">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="tools-page">
                <!-- Page Header -->
                <div class="page-title-section">
                    <h1>Tools Catalog</h1>
                    <p class="page-subtitle">Tools are grouped by app. Select a tool to add to your agents.</p>
                </div>

                <!-- Search Bar -->
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                    <input type="text" id="tool-search"
                        placeholder="Search for a tool by name or by the name of the app..." oninput="filterTools()">
                </div>

                <!-- Tools Section -->
                <section class="content-section">
                    <div class="section-title-row">
                        <h2>Suggested tools</h2>
                        <span class="count-badge" id="tool-count">0</span>
                    </div>

                    <!-- Category Filter -->
                    <div class="filter-pills" id="category-pills">
                        <button class="filter-pill active" data-category="all"
                            onclick="filterByCategory('all', this)">All</button>
                    </div>

                    <div id="tools-grid" class="cards-grid">
                        <div class="loading-indicator">Loading tools...</div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Tool Detail Modal -->
    <div id="tool-modal" class="modal-overlay">
        <div class="modal-box modal-lg">
            <div class="modal-header">
                <h2 id="tool-modal-title">Tool Details</h2>
                <button class="close-btn" onclick="closeToolModal()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Tool Header -->
                <div class="tool-header-block">
                    <div class="tool-icon" id="tool-modal-icon">🔧</div>
                    <div class="tool-info">
                        <h3 id="tool-modal-name">Tool Name</h3>
                        <p id="tool-modal-desc">Tool description</p>
                        <div class="tool-tags">
                            <span class="tool-tag category" id="tool-modal-category">Category</span>
                            <span class="tool-tag source" id="tool-modal-source">Source</span>
                        </div>
                    </div>
                </div>

                <!-- Connection Status -->
                <div class="tool-section" id="tool-connection-section">
                    <h4>Required Connection</h4>
                    <div id="tool-connection-status"></div>
                </div>

                <!-- Parameters -->
                <div class="tool-section">
                    <h4>Parameters</h4>
                    <div id="tool-parameters"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeToolModal()">Close</button>
                <button type="button" class="btn-primary" id="add-tool-btn" onclick="addToolToAgent()">Add to
                    Agent</button>
            </div>
        </div>
    </div>

    <script>
        // Sidebar toggle function
        function toggleSidebar() {
            document.getElementById('main-nav').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('show');
        }

        const API_BASE = 'http://localhost:8000';
        let allTools = [];
        let connectionTypes = [];
        let myConnections = [];
        let currentCategory = 'all';
        let selectedTool = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadTools();
            loadConnections();
        });

        async function loadTools() {
            try {
                const response = await fetch(`${API_BASE}/tools/catalog`);
                const data = await response.json();

                if (data.success) {
                    allTools = data.tools;
                    document.getElementById('tool-count').textContent = allTools.length;
                    buildCategoryPills();
                    renderTools();
                }
            } catch (error) {
                console.error('Failed to load tools:', error);
                document.getElementById('tools-grid').innerHTML =
                    '<div class="empty-state">Failed to load tools. Is the backend running?</div>';
            }
        }

        async function loadConnections() {
            try {
                const typesRes = await fetch(`${API_BASE}/connection-types`);
                const typesData = await typesRes.json();
                if (typesData.success) {
                    connectionTypes = typesData.connection_types;
                }

                const token = localStorage.getItem('auth_token');
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

                const connRes = await fetch(`${API_BASE}/connections`, { headers });
                const connData = await connRes.json();
                if (connData.success) {
                    myConnections = connData.connections;
                }
            } catch (error) {
                console.error('Failed to load connections:', error);
            }
        }

        function buildCategoryPills() {
            const categories = [...new Set(allTools.map(t => t.category))];
            const pillsContainer = document.getElementById('category-pills');

            let html = '<button class="filter-pill active" data-category="all" onclick="filterByCategory(\'all\', this)">All</button>';

            categories.forEach(cat => {
                const label = cat.charAt(0).toUpperCase() + cat.slice(1);
                html += `<button class="filter-pill" data-category="${cat}" onclick="filterByCategory('${cat}', this)">${label}</button>`;
            });

            pillsContainer.innerHTML = html;
        }

        function renderTools() {
            const grid = document.getElementById('tools-grid');
            const searchTerm = document.getElementById('tool-search').value.toLowerCase();

            let filtered = allTools;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(t => t.category === currentCategory);
            }

            if (searchTerm) {
                filtered = filtered.filter(t =>
                    t.name.toLowerCase().includes(searchTerm) ||
                    t.description.toLowerCase().includes(searchTerm) ||
                    t.category.toLowerCase().includes(searchTerm)
                );
            }

            document.getElementById('tool-count').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">No tools found</div>';
                return;
            }

            grid.innerHTML = filtered.map(tool => {
                const hasConnection = !tool.connection_type ||
                    myConnections.some(c => c.connection_type === tool.connection_type);

                const connectionStatus = tool.connection_type
                    ? (hasConnection
                        ? '<span class="conn-status connected">Connected</span>'
                        : '<span class="conn-status needs-setup">Needs setup</span>')
                    : '';

                return `
                    <div class="tool-card" onclick="openToolModal('${tool.id}')">
                        <div class="tool-card-top">
                            <h3>${tool.name}</h3>
                            <span class="category-tag">${tool.category}</span>
                        </div>
                        <div class="tool-card-icon">${tool.icon}</div>
                        <p class="tool-card-desc">${tool.description}</p>
                        <div class="tool-card-bottom">
                            <div class="tool-meta">
                                <span class="source-label">${tool.source === 'python' ? 'Python' : 'MCP'}</span>
                                ${connectionStatus}
                            </div>
                            <span class="add-link" onclick="event.stopPropagation(); openToolModal('${tool.id}')">Add skill +</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterByCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.filter-pill').forEach(pill => pill.classList.remove('active'));
            if (element) element.classList.add('active');
            renderTools();
        }

        function filterTools() {
            renderTools();
        }

        function openToolModal(toolId) {
            const tool = allTools.find(t => t.id === toolId);
            if (!tool) return;

            selectedTool = tool;

            document.getElementById('tool-modal-title').textContent = tool.name;
            document.getElementById('tool-modal-icon').textContent = tool.icon;
            document.getElementById('tool-modal-name').textContent = tool.name;
            document.getElementById('tool-modal-desc').textContent = tool.description;
            document.getElementById('tool-modal-category').textContent = tool.category;
            document.getElementById('tool-modal-source').textContent = tool.source === 'python' ? 'Python' : 'MCP';

            const connSection = document.getElementById('tool-connection-section');
            const connStatus = document.getElementById('tool-connection-status');

            if (tool.connection_type) {
                connSection.style.display = 'block';
                const connType = connectionTypes.find(ct => ct.id === tool.connection_type);
                const userConn = myConnections.find(c => c.connection_type === tool.connection_type);

                if (userConn) {
                    connStatus.innerHTML = `
                        <div class="conn-status-card connected">
                            <span class="status-icon">✓</span>
                            <div class="status-info">
                                <strong>${userConn.name}</strong>
                                <p>Connected to ${connType?.name || tool.connection_type}</p>
                            </div>
                        </div>
                    `;
                } else {
                    connStatus.innerHTML = `
                        <div class="conn-status-card needs-setup">
                            <span class="status-icon">!</span>
                            <div class="status-info">
                                <strong>Connection Required</strong>
                                <p>This tool requires a ${connType?.name || tool.connection_type} connection</p>
                            </div>
                            <a href="connections.html" class="configure-link">Configure Connection</a>
                        </div>
                    `;
                }
            } else {
                connSection.style.display = 'none';
            }

            const paramsDiv = document.getElementById('tool-parameters');
            const params = tool.parameters;

            if (Array.isArray(params) && params.length > 0) {
                paramsDiv.innerHTML = `
                    <table class="params-table">
                        <thead>
                            <tr><th>Name</th><th>Type</th><th>Required</th><th>Default</th></tr>
                        </thead>
                        <tbody>
                            ${params.map(p => `
                                <tr>
                                    <td><code>${p.name}</code></td>
                                    <td>${p.type}</td>
                                    <td>${p.required ? '✓' : '-'}</td>
                                    <td>${p.default !== null ? p.default : '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (typeof params === 'object' && params.properties) {
                const props = Object.entries(params.properties || {});
                const required = params.required || [];

                paramsDiv.innerHTML = `
                    <table class="params-table">
                        <thead>
                            <tr><th>Name</th><th>Type</th><th>Required</th></tr>
                        </thead>
                        <tbody>
                            ${props.map(([name, info]) => `
                                <tr>
                                    <td><code>${name}</code></td>
                                    <td>${info.type || 'any'}</td>
                                    <td>${required.includes(name) ? '✓' : '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                paramsDiv.innerHTML = '<p class="no-params">No parameters required</p>';
            }

            document.getElementById('tool-modal').classList.add('active');
        }

        function closeToolModal() {
            document.getElementById('tool-modal').classList.remove('active');
            selectedTool = null;
        }

        function addToolToAgent() {
            if (!selectedTool) return;

            if (selectedTool.connection_type) {
                const hasConn = myConnections.some(c => c.connection_type === selectedTool.connection_type);
                if (!hasConn) {
                    if (confirm('This tool requires a connection. Configure now?')) {
                        window.location.href = 'connections.html';
                        return;
                    }
                }
            }

            alert(`Tool "${selectedTool.name}" ready to add. Go to Agents page to configure.`);
            closeToolModal();
        }
    </script>
